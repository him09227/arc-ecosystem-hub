<!DOCTYPE html>
<html>
<head>
<title>ARC Quest Tracker</title>
<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}
.card{
background:#1e293b;
padding:15px;
margin:15px 0;
border-radius:12px;
}
.progress{
width:100%;
background:#334155;
border-radius:10px;
}
.bar{
height:20px;
width:0%;
background:#22c55e;
border-radius:10px;
}
button{
padding:10px;
margin-top:10px;
}
</style>
</head>
<body>

<h1>🏆 ARC Quest Tracker</h1>

<div class="card">

<p><input type="checkbox" class="task"> Faucet Claimed</p>
<p><input type="checkbox" class="task"> Onmi Swap Used</p>
<p><input type="checkbox" class="task"> ArcBet Used</p>
<p><input type="checkbox" class="task"> PayTagg Used</p>
<p><input type="checkbox" class="task"> ArcAgent Used</p>
<p><input type="checkbox" class="task"> NFT Minted</p>
<p><input type="checkbox" class="task"> RubyScore Used</p>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="percent">0% Complete</p>

</div>

<a href="index.html">⬅ Back Home</a>

<script>
const tasks=document.querySelectorAll(".task");
const bar=document.getElementById("bar");
const percent=document.getElementById("percent");

tasks.forEach(task=>{
task.addEventListener("change",update);
});

function update(){
let checked=0;
tasks.forEach(task=>{
if(task.checked) checked++;
});

let progress=(checked/tasks.length)*100;

bar.style.width=progress+"%";
percent.innerText=Math.round(progress)+"% Complete";
}
</script>

</body>
</html>
